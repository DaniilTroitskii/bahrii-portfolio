# Netlify: build command and output folder. Netlify passes the site address as URL automatically.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Long cache for resized images (their file names change whenever the image changes)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
